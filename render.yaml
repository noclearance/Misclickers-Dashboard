services:
  - type: web
    name: misclickerz-hub
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: VENNY_API_KEY
        sync: false
      - key: VITE_VENNY_API_KEY
        sync: false
      - key: VITE_STAFF_ROLE_IDS
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: WOM_GROUP_ID
        sync: false
      - key: WOM_API_KEY
        sync: false
      - key: VENNY_CLAN_NOW_URL
        sync: false
